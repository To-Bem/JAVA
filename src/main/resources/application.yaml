spring:
  application:
    name: to-bem-api
  # Sem variáveis de ambiente, usa o H2 local (desenvolvimento).
  # No Docker Compose, DB_URL/DB_USERNAME/DB_PASSWORD apontam para o Oracle.
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/toBemApi}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
      hibernate:
        ddl-auto: update
      show-sql: ${JPA_SHOW_SQL:true}
      properties:
        hibernate:
          format_sql: true

alertas:
  prazo-resposta: PT5M

app:
  jwt:
    secret: ${JWT_SECRET:cHJvamVjdG1ndC1kZXYtc2VjcmV0LWtleS0zMmJ5dGU}
    expiration-ms: 3600000
  admin:
    email: ${ADMIN_EMAIL:admin@tobem.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      roles: ADMIN,MANAGER
  info:
    env:
      enabled: true

info:
  app:
    name: To Bem API
    description: Monitoramento de idosos, dispositivos e alertas.
    version: 1.0
